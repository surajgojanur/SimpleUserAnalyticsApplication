services:
  - type: web
    name: insightflow-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: TRUST_PROXY
        value: '1'
      - key: MONGODB_URI
        sync: false
      - key: DASHBOARD_ORIGIN
        sync: false
